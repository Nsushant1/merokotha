name: merokotha
description: "MeroKotha - Find and list rental rooms in Nepal."

publish_to: 'none' 

sdk: ">=3.11.3 <4.0.0"
version: 1.0.0+11

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  firebase_storage: ^13.2.0
  firebase_messaging: ^16.1.0
  cloud_firestore: ^6.2.0
  go_router: ^17.1.0
  image_picker: ^1.2.1
  cached_network_image: ^3.4.1
  geolocator: ^14.0.2
  flutter_local_notifications: ^18.0.0
  intl: ^0.20.2
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  firebase_app_check: ^0.4.3
  url_launcher: ^6.3.2
  google_fonts: ^8.0.2
  google_sign_in: ^6.2.1
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.13.1
  riverpod_generator: ^4.0.3
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  android: true
  ios: true
  image_path: "assets/merokotha.png"

flutter:
  uses-material-design: true
  assets:
    - assets/merokotha.png
    - assets/kitta.png
    - assets/himavolt.png
    - assets/design/splash_screen_image.jpg
